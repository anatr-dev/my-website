<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kasturi Threads</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d141c; /* Exact color from your logo background */
      color: #d4af37;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    img.logo {
      max-width: 350px;
      width: 90%;
      margin-bottom: 40px;
    }

    .explore-button {
      background-color: transparent;
      color: #d4af37;
      border: 2px solid #d4af37;
      padding: 14px 30px;
      font-size: 1.2em;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .explore-button:hover {
      background-color: #d4af37;
      color: #111a1a;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.85em;
      color: #888;
    }
  </style>
</head>
<body>

  <img src="https://res.cloudinary.com/dlivpvlpk/image/upload/v1746188053/6613c3a0-2883-4626-8fe8-d76b292096e9_qu2hvh.jpg" 
       alt="Kasturi Threads Logo" class="logo">

  <a href="#explore">
    <button class="explore-button">Explore More</button>
  </a>

  <footer>
    &copy; 2025 Kasturi Threads by Kalpana
  </footer>

</body>
</html>
